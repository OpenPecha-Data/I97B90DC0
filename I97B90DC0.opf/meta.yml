  title: དྭགས་བརྒྱུད་སྒྲུབ་པའི་ཐེམ་སྐས་གདམས་ངག་ཕྱོགས་བསྒྲིགས།
  author: མཛད་པ་པོ། མཁས་གྲུབ་རཱ་ག་ཨ་སྱ།, མཛད་པ་པོ། ཀརྨ་ཚེ་དབང་ཀུན་ཁྱབ།, དཔལ་འཁོར་ལོ་སྡོམ་པ་ལྷ་ལྔའི་དཀྱིལ་ཆོག་གི་རྣམ་པར་བཤད་པ་རྣལ་འབྱོར་དགྱེས་པའི་དགའ་སྟོན།
    །, མཛད་པ་པོ། དཀོན་མཆོག་བསྟན་འཛིན།
  authors: &id001
  - མཛད་པ་པོ། མཁས་གྲུབ་རཱ་ག་ཨ་སྱ།
  - མཛད་པ་པོ། ཀརྨ་ཚེ་དབང་ཀུན་ཁྱབ།
  - དཔལ་འཁོར་ལོ་སྡོམ་པ་ལྷ་ལྔའི་དཀྱིལ་ཆོག་གི་རྣམ་པར་བཤད་པ་རྣལ་འབྱོར་དགྱེས་པའི་དགའ་སྟོན།
